            `;
        }
function drawPlayerSummaryTable() {
            const resultsContainer = document.getElementById('player-summary-results');
            const players = Object.keys(playerSummaryState);

            if (players.length === 0) {
                resultsContainer.innerHTML = '<p class="text-gray-500 text-center py-4">Bitte mindestens ein Datum auswählen.</p>';
                return;
            }

            const statsArray = players.map(name => {
                const includedItems = playerSummaryState[name].items.filter(item => item.included);
                return {
                    name: name,
                    ms: includedItems.filter(item => item.category === 'ms').length,
                    os: includedItems.filter(item => item.category === 'os').length,
                    transmog: includedItems.filter(item => item.category === 'transmog').length,
                    bonusroll: includedItems.filter(item => item.category === 'bonusroll').length, // NEU
                    total: includedItems.length
                };
            });
            
            // --- NEU: Sortierlogik ---
            const { column, direction } = summarySortState;
            statsArray.sort((a, b) => {
                if (a[column] !== b[column]) {
                    return direction === 'desc' ? b[column] - a[column] : a[column] - b[column];
                }
                // Sekundäre Sortierung nach Total, dann nach Name
                if (b.total !== a.total) return b.total - a.total;
                return a.name.localeCompare(b.name);
            });
            // --- ENDE Sortierlogik ---

            const tableRows = statsArray.map(player => {
                const itemsHtml = playerSummaryState[player.name].items.map(item => {
                    const wowheadUrl = `https://www.wowhead.com/mop-classic/item=${item.id}`;
                    return `<div class="flex items-center gap-2 px-2 py-1"><input type="checkbox" class="item-inclusion-checkbox" data-player-name="${player.name}" data-item-id="${item.uniqueId}" ${item.included ? 'checked' : ''}><a href="${wowheadUrl}" target="_blank" rel="noopener noreferrer" class="hover:underline text-sm">[${item.name}]</a><span class="text-xs uppercase bg-slate-600 px-1.5 py-0.5 rounded-full">${item.category}</span></div>`;
                }).join('');
                const isHidden = playerSummaryState[player.name].isDetailsOpen ? '' : 'hidden';
                const rotation = playerSummaryState[player.name].isDetailsOpen ? 'rotate-90' : '';
                return `<tr class="border-b border-slate-700 hover:bg-slate-750/50">
                                <td class="px-4 py-3 font-medium"><button class="toggle-details-btn flex items-center gap-2" data-player-name="${player.name}">${player.name} <span class="text-xs text-gray-400 transition-transform ${rotation}">▶</span></button></td>
                                <td class="px-4 py-3 text-center">${player.ms}</td>
                                <td class="px-4 py-3 text-center">${player.os}</td>
                                <td class="px-4 py-3 text-center">${player.transmog}</td>
                                <td class="px-4 py-3 text-center">${player.bonusroll}</td> <td class="px-4 py-3 text-center font-bold text-gold">${player.total}</td>
                            </tr>
                            <tr class="item-details-row ${isHidden} bg-slate-800">
                                <td colspan="6" class="p-2"><div class="flex flex-col gap-1">${itemsHtml}</div></td> </tr>`;
                }).join('');

            // --- NEU: Dynamische Kopfzeile mit Sortier-Buttons ---
            const sortableColumns = { 'MS': 'ms', 'OS': 'os', 'Transmog': 'transmog', 'Bonus': 'bonusroll', 'Total': 'total' };
            const headerHtml = Object.entries(sortableColumns).map(([title, key]) => {
                const isActive = summarySortState.column === key;
                const indicator = isActive ? (summarySortState.direction === 'desc' ? '▼' : '▲') : '';
                return `<th scope="col" class="px-4 py-3 text-center"><button class="sort-btn font-bold uppercase ${isActive ? 'text-gold' : 'text-gray-400'}" data-sort-column="${key}">${title} <span class="indicator w-4 inline-block">${indicator}</span></button></th>`;
            }).join('');

            resultsContainer.innerHTML = `<div class="overflow-x-auto rounded-lg border border-slate-700"><table class="min-w-full text-sm text-left text-gray-300"><thead class="text-xs uppercase bg-slate-700"><tr><th scope="col" class="px-4 py-3">Spieler</th>${headerHtml}</tr></thead><tbody class="divide-y divide-slate-700">${tableRows}</tbody></table></div>`;
            
            // Event Listener hinzufügen
            resultsContainer.querySelectorAll('.toggle-details-btn').forEach(btn => btn.addEventListener('click', handleToggleDetails));
            resultsContainer.querySelectorAll('.item-inclusion-checkbox').forEach(cb => cb.addEventListener('change', handleItemInclusionChange));
            resultsContainer.querySelectorAll('.sort-btn').forEach(btn => btn.addEventListener('click', handleSummarySort));
        }
		function handleSummarySort(event) {
            const newColumn = event.currentTarget.dataset.sortColumn;
            if (summarySortState.column === newColumn) {
                // Wenn die selbe Spalte geklickt wird, Richtung umkehren
                summarySortState.direction = summarySortState.direction === 'desc' ? 'asc' : 'desc';
            } else {
                // Bei Klick auf eine neue Spalte, diese als aktiv setzen und Standardrichtung (desc) wählen
                summarySortState.column = newColumn;
                summarySortState.direction = 'desc';
            }
            // Tabelle mit neuer Sortierung neu zeichnen
            drawPlayerSummaryTable();
        }

        // ZWEI WEITERE NEUE FUNKTIONEN
function handleToggleDetails(event) {
            const button = event.currentTarget;
            // KORREKTUR: Spielername wird aus data-Attribut gelesen (sicherer)
            const playerName = button.dataset.playerName;
            
            if (playerSummaryState[playerName]) {
                // Den Zustand im State-Objekt umschalten
                playerSummaryState[playerName].isDetailsOpen = !playerSummaryState[playerName].isDetailsOpen;
            }
            
            // Tabelle neu zeichnen, um die Änderung (offen/geschlossen) anzuzeigen
            drawPlayerSummaryTable();
        }

function handleItemInclusionChange(event) {
            const checkbox = event.target;
            const playerName = checkbox.dataset.playerName;
            // KORREKTUR: Wir lesen das data-item-id Attribut
            const itemId = checkbox.dataset.itemId;

            // KORREKTUR: Wir finden das Item anhand der neuen uniqueId Eigenschaft
            const item = playerSummaryState[playerName]?.items.find(i => i.uniqueId === itemId);
            if (item) {
                item.included = checkbox.checked;
            }
            drawPlayerSummaryTable();
        }

// ============== COOLDOWN-EDITOR FUNKTIONEN ==============

function initCooldownEditor() {
    const form = document.getElementById('cooldown-form');
    const classSelect = document.getElementById('cooldown-class-select');
    const cancelBtn = document.getElementById('cooldown-cancel-btn');

    // Klassen-Dropdown füllen
    classSelect.innerHTML = wowClasses.map(c => `<option value="${c}">${c.charAt(0) + c.slice(1).toLowerCase()}</option>`).join('');

    // Event Listener für das Formular
    form.addEventListener('submit', handleCooldownFormSubmit);
    cancelBtn.addEventListener('click', () => {
        form.reset();
        document.getElementById('cooldown-id-input').value = '';
        document.getElementById('cooldown-form-title').textContent = 'Neuen Cooldown hinzufügen';
        document.getElementById('cooldown-save-btn').textContent = 'Speichern';
        cancelBtn.style.display = 'none';
    });

    // Initiale Liste laden
    displayCooldowns();
}

async function displayCooldowns() {
    const tableBody = document.getElementById('cooldowns-table-body');
    if (!tableBody) return;

    const cooldownsCollectionRef = collection(db, "cooldowns");
    const q = query(cooldownsCollectionRef, orderBy("order", "asc"), orderBy("name", "asc"));
    const snapshot = await getDocs(q);

    tableBody.innerHTML = ''; // Tabelle leeren
    snapshot.forEach(doc => {
        const cd = doc.data();
        const row = tableBody.insertRow();
        row.innerHTML = `
            <td class="px-4 py-2">${cd.name}</td>
            <td class="px-4 py-2" style="color: ${window.classColors[cd.class] || '#FFFFFF'};">${cd.class}</td>
            <td class="px-4 py-2 text-gray-400">${cd.spellId || ''}</td> <td class="px-4 py-2">
            <td class="px-4 py-2">
                <button class="text-sm text-blue-400 hover:underline edit-cd-btn" data-id="${doc.id}">Edit</button>
                <button class="text-sm text-red-500 hover:underline delete-cd-btn ml-2" data-id="${doc.id}">X</button>
            </td>
        `;
    });

    // Event Listener für die neuen Buttons
    tableBody.querySelectorAll('.edit-cd-btn').forEach(btn => {
        btn.addEventListener('click', (e) => populateCooldownFormForEdit(e.target.dataset.id));
    });
    tableBody.querySelectorAll('.delete-cd-btn').forEach(btn => {
        btn.addEventListener('click', (e) => handleDeleteCooldown(e.target.dataset.id, e.target.closest('tr').cells[0].textContent));
    });
}

async function handleCooldownFormSubmit(event) {
    event.preventDefault();
    if (!window.isManager) return;

    const cooldownId = document.getElementById('cooldown-id-input').value;
    const cooldownData = {
        name: document.getElementById('cooldown-name-input').value,
        class: document.getElementById('cooldown-class-select').value,
        type: document.getElementById('cooldown-type-select').value,
        order: parseInt(document.getElementById('cooldown-order-input').value) || 100,
        spellId: document.getElementById('cooldown-spellid-input').value || "",
        tooltip: document.getElementById('cooldown-tooltip-input').value || "",
    };

    try {
        if (cooldownId) {
            // Update
            const docRef = doc(db, "cooldowns", cooldownId);
            await updateDoc(docRef, cooldownData);
            window.showModal("Cooldown erfolgreich aktualisiert!");
        } else {
            // Create
            await addDoc(collection(db, "cooldowns"), cooldownData);
            window.showModal("Neuer Cooldown erfolgreich hinzugefügt!");
        }
        
        // Formular zurücksetzen und Listen neu laden
        document.getElementById('cooldown-form').reset();
        document.getElementById('cooldown-id-input').value = '';
        document.getElementById('cooldown-form-title').textContent = 'Neuen Cooldown hinzufügen';
        document.getElementById('cooldown-save-btn').textContent = 'Speichern';
        document.getElementById('cooldown-cancel-btn').style.display = 'none';
        
        await displayCooldowns(); // UI-Tabelle aktualisieren
        await fetchAllCooldowns(); // Globale Variable für Boss-Seiten aktualisieren
        
    } catch (error) {
        console.error("Fehler beim Speichern des Cooldowns:", error);
        window.showModal("Ein Fehler ist aufgetreten.");
    }
}

async function populateCooldownFormForEdit(cooldownId) {
    const docRef = doc(db, "cooldowns", cooldownId);
    const docSnap = await getDoc(docRef);
    if (!docSnap.exists()) return;

    const cd = docSnap.data();
    document.getElementById('cooldown-id-input').value = cooldownId;
    document.getElementById('cooldown-name-input').value = cd.name;
    document.getElementById('cooldown-class-select').value = cd.class;
    document.getElementById('cooldown-type-select').value = cd.type;
    document.getElementById('cooldown-order-input').value = cd.order;
    document.getElementById('cooldown-spellid-input').value = cd.spellId || '';
    document.getElementById('cooldown-tooltip-input').value = cd.tooltip || '';
    

    document.getElementById('cooldown-form-title').textContent = 'Cooldown bearbeiten';
    document.getElementById('cooldown-save-btn').textContent = 'Aktualisieren';
    document.getElementById('cooldown-cancel-btn').style.display = 'inline-block';
}

async function handleDeleteCooldown(cooldownId, cooldownName) {
    const confirmed = await window.showModal(`Soll der Cooldown "${cooldownName}" wirklich gelöscht werden?`, true);
    if (confirmed) {
        await deleteDoc(doc(db, "cooldowns", cooldownId));
        await displayCooldowns();
        await fetchAllCooldowns();
    }
}
window.makePlannerSortable = function(containerId) {
    const container = document.getElementById(containerId);
    if (!container) return;

    const header = container.querySelector('.planner-header');
    // Wichtig: Wir müssen wissen, wo die Zeilen drin liegen (im neuen rows-container)
    const rowsContainer = container.querySelector('[id$="-rows-container"]') || container;

    if (!header) return;

    let sortDirection = 1; // 1 = aufsteigend, -1 = absteigend

    // Durch alle Header-Spalten iterieren
    Array.from(header.children).forEach((th, colIndex) => {
        // Ignorieren: 
        // 0 = Griff
        // Letzte 2 = Toggle Button & Actions
        if (colIndex === 0 || colIndex >= header.children.length - 2) {
            th.style.cursor = 'default';
            return;
        }

        // Klickbar machen
        th.style.cursor = 'pointer';
        th.title = "Sortieren";
        th.classList.add('hover:text-white', 'transition-colors');

        th.onclick = () => {
            sortDirection *= -1; // Richtung wechseln
            const rows = Array.from(rowsContainer.querySelectorAll('.planner-row'));
            
            rows.sort((a, b) => {
                const getVal = (row) => {
                    const el = row.children[colIndex];
                    if (!el) return "";
                    return el.value || el.textContent || ""; 
                };

                let valA = getVal(a).toLowerCase();
                let valB = getVal(b).toLowerCase();

                // --- SPEZIAL-FÄLLE ---

                // Spalte 3: % / # (Zahlen)
                if (colIndex === 3) { 
                    return (parseFloat(valA || 0) - parseFloat(valB || 0)) * sortDirection;
                }
                
                // Spalte 4: Zeit (Min:Sek oder Sek)
                if (colIndex === 4) {
                    const toSec = (t) => {
                        if (!t) return 0;
                        if (t.includes(':')) {
                           const parts = t.split(':');
                           return parseInt(parts[0])*60 + parseInt(parts[1]);
                        }
                        return parseFloat(t) || 0;
                    };
                    return (toSec(valA) - toSec(valB)) * sortDirection;
                }

                // Standard Text-Vergleich
                return valA.localeCompare(valB) * sortDirection;
            });

            // Zeilen neu einsortieren
            rows.forEach(row => rowsContainer.appendChild(row));
        };
    });
};
